name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # Without helm on PATH the render-path tests skip, so CI would be green
      # while never once checking that a generated chart actually renders.
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.1

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "FAIL: go.mod or go.sum is not tidy"
            exit 1
          fi
          echo "PASS: go.mod is tidy"

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -d .
            exit 1
          fi

      - name: Run tests with coverage
        run: go test ./... -v -race -cover -coverprofile=coverage.out

      - name: Display coverage summary
        run: go tool cover -func=coverage.out

  build:
    name: Build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        run: make build

      - name: Verify version
        run: ./bin/hck version

  e2e:
    name: End to End
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.1

      - name: Build
        run: make build

      # Every preset must produce a chart that passes hck's own check with no
      # findings, and must keep passing after a resource is added to it.
      - name: Scaffold and check every preset
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          for preset in web worker cronjob stateful daemon; do
            echo "::group::$preset"
            hck new "$preset" --dir "$workdir" --preset "$preset"
            hck check --chart "$workdir/$preset" --strict
            echo "::endgroup::"
          done

      - name: Add resources to an existing chart
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir"
          chart="$workdir/demo"

          cp "$chart/values.yaml" /tmp/values.before
          hck add servicemonitor prometheusrule externalsecret pvc rbac certificate podmonitor scaledobject vpa --chart "$chart"
          hck check --chart "$chart" --strict

          # The bytes that were there before must still be there, unchanged.
          before=$(wc -c < /tmp/values.before)
          head -c "$before" "$chart/values.yaml" > /tmp/values.prefix
          cmp /tmp/values.before /tmp/values.prefix

          # And a repeat must change nothing at all.
          cp "$chart/values.yaml" /tmp/values.once
          hck add servicemonitor --chart "$chart"
          cmp /tmp/values.once "$chart/values.yaml"

      # A generated schema must accept the chart it was generated for, stay in
      # step as resources are added, and still reject what it claims to.
      - name: Generate and enforce values.schema.json
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)

          for preset in web worker cronjob stateful daemon; do
            echo "::group::$preset"
            hck new "$preset" --dir "$workdir" --preset "$preset" --schema
            hck check --chart "$workdir/$preset" --strict
            hck schema --chart "$workdir/$preset" --check
            echo "::endgroup::"
          done

          # Adding a resource must carry the schema along with values.yaml.
          chart="$workdir/web"
          hck add servicemonitor prometheusrule job secret certificate podmonitor scaledobject vpa --chart "$chart"
          hck schema --chart "$chart" --check
          hck check --chart "$chart" --strict

          # --strict survives a regeneration.
          hck new strictapp --dir "$workdir" --schema-strict
          hck add pdb --chart "$workdir/strictapp"
          hck schema --chart "$workdir/strictapp" --check
          grep -q '"additionalProperties": false' "$workdir/strictapp/values.schema.json"

          # And the schema has to actually reject something.
          if helm template rel "$chart" -f "$chart/ci/install-values.yaml" \
               --set image.pullPolicy=Sometimes >/dev/null 2>&1; then
            echo "FAIL: the schema accepted an invalid pullPolicy"
            exit 1
          fi
          echo "PASS: schema enforced"

      # The values table has to regenerate identically, survive hand-written
      # text around it, and grow when a resource adds values.
      - name: Generate and check the values table
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir" --schema
          chart="$workdir/demo"

          hck docs --chart "$chart" --write
          hck docs --chart "$chart" --check

          printf '\n<br/>\n\n## Notes\n\nKeep me.\n' >> "$chart/README.md"
          hck add servicemonitor --chart "$chart"
          if hck docs --chart "$chart" --check; then
            echo "FAIL: --check passed a README that predates the new values"
            exit 1
          fi
          hck docs --chart "$chart" --write
          hck docs --chart "$chart" --check
          grep -q 'Keep me.' "$chart/README.md"
          grep -q 'metrics.serviceMonitor.enabled' "$chart/README.md"
          echo "PASS: values table"

      # Every platform overlay has to render, on every preset that produces
      # one. An overlay that does not render looks like configuration right up
      # until someone installs with it.
      - name: Render every preset on every platform
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          for preset in web worker cronjob stateful daemon; do
            for platform in aws gcp azure onprem; do
              name="$preset-$platform"
              hck new "$name" --dir "$workdir" --preset "$preset" --platform "$platform" --schema >/dev/null
              if [ ! -f "$workdir/$name/values-$platform.yaml" ]; then
                echo "FAIL: $preset produced no overlay for $platform"
                exit 1
              fi
              hck check --chart "$workdir/$name" --platform "$platform" --strict >/dev/null
            done
            echo "  $preset: 4 platforms ok"
          done

          # Adding to an existing chart, and the guard when the overlay is absent.
          hck new later --dir "$workdir" >/dev/null
          hck platform add aws --chart "$workdir/later"
          hck check --chart "$workdir/later" --platform aws --strict >/dev/null
          if hck check --chart "$workdir/later" --platform gcp >/dev/null 2>&1; then
            echo "FAIL: --platform gcp passed without values-gcp.yaml"
            exit 1
          fi

          # An overlay that is merely accepted proves nothing: a check that
          # renders the base chart renders it fine. Assert the render changed.
          chart="$workdir/later"
          if hck check --chart "$chart" --print | grep -q 'eks.amazonaws.com/role-arn'; then
            echo "FAIL: the base already carries the IRSA annotation"
            exit 1
          fi
          hck check --chart "$chart" --platform aws --print | grep -q 'eks.amazonaws.com/role-arn' || {
            echo "FAIL: --platform aws did not reach the render"
            exit 1
          }
          echo "PASS: platform overlays"

      # Environment overlays stack on top of a platform, and go last so their
      # size wins over whatever the platform set.
      - name: Render every preset at every environment
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          for preset in web worker cronjob stateful daemon; do
            for env in dev staging prod; do
              name="$preset-$env"
              hck new "$name" --dir "$workdir" --preset "$preset" --env "$env" --schema >/dev/null
              hck check --chart "$workdir/$name" --env "$env" --strict >/dev/null
            done
            echo "  $preset: 3 environments ok"
          done

          # Both axes at once, and the environment has to win.
          hck new both --dir "$workdir" --preset web --platform aws --env prod --schema >/dev/null
          chart="$workdir/both"
          hck check --chart "$chart" --platform aws --env prod --strict >/dev/null
          hck check --chart "$chart" --platform aws --env prod --print | grep -q 'eks.amazonaws.com/role-arn' || {
            echo "FAIL: the platform overlay was lost when an environment was added"
            exit 1
          }
          hck check --chart "$chart" --platform aws --env prod --print | grep -q 'kind: PodDisruptionBudget' || {
            echo "FAIL: the prod overlay did not reach the render"
            exit 1
          }
          echo "PASS: environment overlays"

      # A chart that never asked for a schema must not acquire one.
      - name: Keep the schema opt-in
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new noschema --dir "$workdir"
          hck add pdb servicemonitor --chart "$workdir/noschema"
          if [ -e "$workdir/noschema/values.schema.json" ]; then
            echo "FAIL: hck add introduced a schema the chart never asked for"
            exit 1
          fi
          echo "PASS: opt-in"

      - name: Refuse a second workload
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir"

          # Adding one next to the workload already there.
          if hck add statefulset --chart "$workdir/demo"; then
            echo "FAIL: a second workload was accepted by hck add"
            exit 1
          fi

          # --with on top of the preset's own workload. This used to build the
          # chart, and the chart it built rendered two controllers sharing one
          # image and one updateStrategy.
          if hck new two --dir "$workdir" --preset web --with daemonset; then
            echo "FAIL: a second workload was accepted by hck new --with"
            exit 1
          fi

          # Two arriving in the same command, into a chart that has none.
          hck new bare --dir "$workdir" --preset cronjob
          rm "$workdir/bare/templates/cronjob.yaml"
          if hck add deployment daemonset --chart "$workdir/bare"; then
            echo "FAIL: two workloads at once were accepted"
            exit 1
          fi

          # --force is the escape hatch, and check has to report what it let
          # through rather than the chart passing silently.
          hck add daemonset --chart "$workdir/demo" --force
          hck check --chart "$workdir/demo" | grep -q HCK030
          if hck check --chart "$workdir/demo" --strict; then
            echo "FAIL: --strict passed a chart with two workloads"
            exit 1
          fi
          echo "PASS: refused"

  ci-result:
    name: CI Result
    if: always()
    needs:
      - unit-tests
      - build
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "[FAIL] Some jobs failed or were cancelled"
            exit 1
          fi
          echo "[PASS] All CI jobs passed"
