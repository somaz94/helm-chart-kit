name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # Without helm on PATH the render-path tests skip, so CI would be green
      # while never once checking that a generated chart actually renders.
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.1

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "FAIL: go.mod or go.sum is not tidy"
            exit 1
          fi
          echo "PASS: go.mod is tidy"

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -d .
            exit 1
          fi

      - name: Run tests with coverage
        run: go test ./... -v -race -cover -coverprofile=coverage.out

      - name: Display coverage summary
        run: go tool cover -func=coverage.out

  build:
    name: Build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        run: make build

      - name: Verify version
        run: ./bin/hck version

  e2e:
    name: End to End
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.1

      - name: Build
        run: make build

      # Every preset must produce a chart that passes hck's own check with no
      # findings, and must keep passing after a resource is added to it.
      #
      # The list comes from "hck list presets" rather than being written out
      # here: a preset added to the catalog and not to this line would be the
      # one preset nothing ever renders, and the step would stay green. Only
      # the name column starts at that indent, so awk picks it out and skips
      # the resource line under each one.
      - name: Scaffold and check every preset
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          for preset in $(hck list presets --format json | jq -r '.presets[].name'); do
            echo "::group::$preset"
            hck new "$preset" --dir "$workdir" --preset "$preset"
            hck check --chart "$workdir/$preset" --strict
            echo "::endgroup::"
          done

      - name: Add resources to an existing chart
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir"
          chart="$workdir/demo"

          cp "$chart/values.yaml" /tmp/values.before
          hck add servicemonitor prometheusrule externalsecret pvc rbac certificate podmonitor scaledobject vpa --chart "$chart"
          hck check --chart "$chart" --strict

          # The bytes that were there before must still be there, unchanged.
          before=$(wc -c < /tmp/values.before)
          head -c "$before" "$chart/values.yaml" > /tmp/values.prefix
          cmp /tmp/values.before /tmp/values.prefix

          # And a repeat must change nothing at all.
          cp "$chart/values.yaml" /tmp/values.once
          hck add servicemonitor --chart "$chart"
          cmp /tmp/values.once "$chart/values.yaml"

      # Every assertion in this workflow reads --format json, so the field
      # names are the contract and this is where it is pinned. The text output
      # is for people: its indentation changed once and took the awk parsers
      # in this file down with it, which is what --format json is the answer
      # to. A field removed or renamed has to fail here rather than in
      # whatever reads it next.
      - name: The JSON contract
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir" --preset minimal >/dev/null
          chart="$workdir/demo"

          # Naming a section leaves the others out, so a consumer can tell
          # "none" from "not asked".
          hck list presets --format json | jq -e '.presets | length > 0 and (map(.name) | index("web"))' >/dev/null
          hck list presets --format json | jq -e 'has("resources") | not' >/dev/null || {
            echo "FAIL: hck list presets carried resources"
            exit 1
          }
          hck list resources --format json \
            | jq -e '.resources | length > 0 and all(.[]; .name != "" and .group != "" and .file != "" and .apiVersion != "")' >/dev/null
          hck list resources --format json | jq -e '.groups | length > 0' >/dev/null
          hck list rules --format json | jq -e '.rules | length > 0 and all(.[]; .id != "" and .severity != "")' >/dev/null
          hck list --format json | jq -e '.presets and .resources and .rules and .groups' >/dev/null || {
            echo "FAIL: hck list --format json left a section out"
            exit 1
          }

          # The platform field is what makes a gcp-only resource findable by a
          # script; it is absent on the neutral ones by design.
          hck list resources --format json \
            | jq -e 'any(.resources[]; .platform == "gcp")' >/dev/null || {
            echo "FAIL: no resource reports a platform"
            exit 1
          }

          # sync answers which files were compared and how each came out.
          hck sync --chart "$chart" --format json | jq -e '.ok' >/dev/null || {
            echo "FAIL: a freshly generated chart reported drift"
            exit 1
          }
          printf '\n{{/* mine */}}\n' >> "$chart/templates/_helpers.tpl"
          rm "$chart/ci/install-values.yaml"
          report=$(hck sync --chart "$chart" --format json)
          jq -e '.ok == false' >/dev/null <<<"$report"
          jq -e 'any(.files[]; .path == "templates/_helpers.tpl" and .state == "edited")' >/dev/null <<<"$report"
          jq -e 'any(.files[]; .path == "ci/install-values.yaml" and .state == "missing")' >/dev/null <<<"$report"

          # --check still fails, and still prints the document.
          set +e
          out=$(hck sync --chart "$chart" --format json --check 2>/dev/null)
          status=$?
          set -e
          [ "$status" -ne 0 ] || { echo "FAIL: --check passed a chart with drift"; exit 1; }
          jq -e '.ok == false' >/dev/null <<<"$out" || {
            echo "FAIL: --check suppressed the document"
            exit 1
          }
          echo "PASS: the JSON contract"

      # "@name" stands for a group's members. The listing is where somebody
      # learns the groups exist, so it has to carry them, and every resource
      # has to still be reachable through one — a resource in no group is
      # invisible in a listing that iterates groups.
      - name: Groups stand for their members
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir" --preset minimal
          chart="$workdir/demo"

          listing=$(hck list resources)
          groups=$(printf '%s' "$listing" | awk '/^  @/ {print $1}')
          [ -n "$groups" ] || { echo "FAIL: the listing carries no groups"; exit 1; }

          # Every resource appears under exactly one group header.
          for name in $(hck list resources --format json | jq -r '.resources[].name'); do
            n=$(printf '%s' "$listing" | awk -v r="$name" '/^    [a-z]/ && $1 == r' | wc -l | tr -d ' ')
            [ "$n" = "1" ] || { echo "FAIL: $name appears $n times in the listing"; exit 1; }
          done

          # Adding a group adds its members, all of them and nothing else.
          hck add @observability --chart "$chart" >/dev/null
          for f in servicemonitor podmonitor prometheusrule grafana-dashboard; do
            test -f "$chart/templates/$f.yaml" || {
              echo "FAIL: @observability did not write $f.yaml"
              exit 1
            }
          done
          hck check --chart "$chart" --strict >/dev/null

          # A group beside one of its own members resolves once, and the
          # second run writes nothing new.
          hck new g2 --dir "$workdir" --preset minimal --with @exposure,service >/dev/null
          hck check --chart "$workdir/g2" --strict >/dev/null
          cp "$workdir/g2/values.yaml" /tmp/g2.before
          hck add @exposure --chart "$workdir/g2" >/dev/null
          cmp /tmp/g2.before "$workdir/g2/values.yaml"

          # An unknown group is an error that names the groups, not one that
          # names 32 resources.
          set +e
          err=$(hck add @monitoring --chart "$chart" 2>&1)
          status=$?
          set -e
          [ "$status" -ne 0 ] || { echo "FAIL: an unknown group was accepted"; exit 1; }
          [[ "$err" == *"unknown group"* ]] || { echo "FAIL: wrong error: $err"; exit 1; }
          [[ "$err" == *"@observability"* ]] || { echo "FAIL: the error does not list the groups: $err"; exit 1; }
          echo "PASS: groups"

      # A SecretStore beside an ExternalSecret is a pair that has to be wired
      # by hand: the ref has a meaningful default, so hck reports rather than
      # repointing it. Same shape as the Issuer/Certificate pair above.
      - name: The SecretStore pair
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new ss --dir "$workdir" --preset web --with secretstore,externalsecret >/dev/null
          chart="$workdir/ss"

          fires() {
            hck check --chart "$chart" -f "$1" --format json 2>/dev/null \
              | jq -e 'any(.findings[]; .rule == "HCK039")' >/dev/null
          }

          # Both halves on, the ref left at its default: reported.
          printf 'image: {tag: "1.0.0"}\nsecretStore: {enabled: true, provider: {fake: {}}}\nexternalSecret: {enabled: true}\n' > "$workdir/unwired.yaml"
          fires "$workdir/unwired.yaml" || {
            echo "FAIL: an unwired SecretStore pair was not reported"
            exit 1
          }

          # Wired, and it goes quiet.
          printf 'image: {tag: "1.0.0"}\nsecretStore: {enabled: true, provider: {fake: {}}}\nexternalSecret: {enabled: true, secretStoreRef: {name: ss, kind: SecretStore}}\n' > "$workdir/wired.yaml"
          if fires "$workdir/wired.yaml"; then
            echo "FAIL: HCK039 fires over a pair that is wired"
            exit 1
          fi
          hck check --chart "$chart" -f "$workdir/wired.yaml" --strict >/dev/null

          # A store on its own says nothing: that is a chart that has not
          # added the ExternalSecret yet, not a mistake.
          printf 'image: {tag: "1.0.0"}\nsecretStore: {enabled: true, provider: {fake: {}}}\n' > "$workdir/alone.yaml"
          if fires "$workdir/alone.yaml"; then
            echo "FAIL: a SecretStore with no ExternalSecret was reported"
            exit 1
          fi

          # The provider block comes from the platform overlay, and each cloud
          # fills it with its own.
          for p in aws gcp azure; do
            hck platform add "$p" --chart "$chart" >/dev/null
            overlay=$(cat "$chart/values-$p.yaml")
            [[ "$overlay" == *"secretStore:"* ]] || {
              echo "FAIL: the $p overlay does not carry a SecretStore provider"
              exit 1
            }
          done
          grep -q 'aws:' "$chart/values-aws.yaml"
          grep -q 'gcpsm:' "$chart/values-gcp.yaml"
          grep -q 'azurekv:' "$chart/values-azure.yaml"
          echo "PASS: the SecretStore pair"

      # A platform resource is a kind that only exists on one cloud, which an
      # overlay cannot express: an overlay changes what an annotation says, it
      # cannot conjure the object the annotation names. The wiring is the part
      # worth guarding — the chart has to set the annotation itself, or the
      # values comment saying it does is the only thing that does.
      - name: Platform-only resources and their wiring
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new gke --dir "$workdir" --preset web \
            --with managedcertificate,backendconfig,frontendconfig,podmonitoring >/dev/null
          chart="$workdir/gke"
          printf 'image: {tag: "1.0.0"}\ningress: {enabled: true}\nmanagedCertificate: {enabled: true}\nbackendConfig: {enabled: true}\nfrontendConfig: {enabled: true}\n' > "$workdir/on.yaml"

          # The listing marks them, which is where anybody learns they exist.
          # Captured, not piped into grep -q: that closes the pipe on its first
          # match and pipefail then fails the step for a passing assertion.
          listing=$(hck list resources)
          [[ "$listing" == *"managedcertificate"*"[gcp]"* ]] || {
            echo "FAIL: the listing does not mark managedcertificate as gcp-only"
            exit 1
          }

          # A group never pulls one in, and says which it left out.
          hck new plain --dir "$workdir" --preset minimal >/dev/null
          note=$(hck add @secrets --chart "$workdir/plain")
          test -f "$workdir/plain/templates/managedcertificate.yaml" && {
            echo "FAIL: @secrets pulled in a gcp-only resource"
            exit 1
          }
          [[ "$note" == *"managedcertificate (gcp)"* ]] || {
            echo "FAIL: the group did not report what it left out"
            exit 1
          }
          # Named explicitly it still goes in.
          hck add managedcertificate --chart "$workdir/plain" >/dev/null
          test -f "$workdir/plain/templates/managedcertificate.yaml" || {
            echo "FAIL: naming it explicitly did not add it"
            exit 1
          }

          # The chart wires the annotations itself. Each is referenced by name
          # and by nothing else, so this is the whole contract.
          rendered=$(hck check --chart "$chart" -f "$workdir/on.yaml" --print)
          for a in 'networking.gke.io/managed-certificates: gke' \
                   'networking.gke.io/v1beta1.FrontendConfig: gke' \
                   'cloud.google.com/backend-config'; do
            [[ "$rendered" == *"$a"* ]] || { echo "FAIL: $a was not wired"; exit 1; }
          done

          # And they vanish when the resource is off, rather than naming an
          # object the chart no longer renders.
          printf 'image: {tag: "1.0.0"}\ningress: {enabled: true}\n' > "$workdir/off.yaml"
          off=$(hck check --chart "$chart" -f "$workdir/off.yaml" --print)
          for a in 'managed-certificates' 'FrontendConfig' 'backend-config'; do
            [[ "$off" != *"$a"* ]] || { echo "FAIL: $a survived the resource being off"; exit 1; }
          done

          # HCK038: an annotation naming something the chart does not render.
          printf 'image: {tag: "1.0.0"}\ningress: {enabled: true, annotations: {"networking.gke.io/v1beta1.FrontendConfig": "nope"}}\n' > "$workdir/dangling.yaml"
          hck check --chart "$chart" -f "$workdir/dangling.yaml" --format json 2>/dev/null \
            | jq -e 'any(.findings[]; .rule == "HCK038")' >/dev/null || {
            echo "FAIL: a dangling FrontendConfig reference was not reported"
            exit 1
          }

          # HCK037: two resources answering one question.
          printf 'image: {tag: "1.0.0"}\ncertificate: {enabled: true}\nmanagedCertificate: {enabled: true}\n' > "$workdir/both.yaml"
          hck add certificate --chart "$chart" >/dev/null
          hck check --chart "$chart" -f "$workdir/both.yaml" --format json 2>/dev/null \
            | jq -e 'any(.findings[]; .rule == "HCK037")' >/dev/null || {
            echo "FAIL: a cert-manager Certificate beside a ManagedCertificate was not reported"
            exit 1
          }
          echo "PASS: platform resources"

      # A generated schema must accept the chart it was generated for, stay in
      # step as resources are added, and still reject what it claims to.
      - name: Generate and enforce values.schema.json
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)

          for preset in $(hck list presets --format json | jq -r '.presets[].name'); do
            echo "::group::$preset"
            hck new "$preset" --dir "$workdir" --preset "$preset" --schema
            hck check --chart "$workdir/$preset" --strict
            hck schema --chart "$workdir/$preset" --check
            echo "::endgroup::"
          done

          # Adding a resource must carry the schema along with values.yaml.
          chart="$workdir/web"
          hck add servicemonitor prometheusrule job secret certificate podmonitor scaledobject vpa --chart "$chart"
          hck schema --chart "$chart" --check
          hck check --chart "$chart" --strict

          # --strict survives a regeneration.
          hck new strictapp --dir "$workdir" --schema-strict
          hck add pdb --chart "$workdir/strictapp"
          hck schema --chart "$workdir/strictapp" --check
          grep -q '"additionalProperties": false' "$workdir/strictapp/values.schema.json"

          # And the schema has to actually reject something.
          if helm template rel "$chart" -f "$chart/ci/install-values.yaml" \
               --set image.pullPolicy=Sometimes >/dev/null 2>&1; then
            echo "FAIL: the schema accepted an invalid pullPolicy"
            exit 1
          fi
          echo "PASS: schema enforced"

      # The values table has to regenerate identically, survive hand-written
      # text around it, and grow when a resource adds values.
      - name: Generate and check the values table
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir" --schema
          chart="$workdir/demo"

          hck docs --chart "$chart" --write
          hck docs --chart "$chart" --check

          printf '\n<br/>\n\n## Notes\n\nKeep me.\n' >> "$chart/README.md"
          hck add servicemonitor --chart "$chart"
          if hck docs --chart "$chart" --check; then
            echo "FAIL: --check passed a README that predates the new values"
            exit 1
          fi
          hck docs --chart "$chart" --write
          hck docs --chart "$chart" --check
          grep -q 'Keep me.' "$chart/README.md"
          grep -q 'metrics.serviceMonitor.enabled' "$chart/README.md"
          echo "PASS: values table"

      # Every platform overlay has to render, on every preset that produces
      # one. An overlay that does not render looks like configuration right up
      # until someone installs with it.
      - name: Render every preset on every platform
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          for preset in $(hck list presets --format json | jq -r '.presets[].name'); do
            for platform in aws gcp azure onprem; do
              name="$preset-$platform"
              hck new "$name" --dir "$workdir" --preset "$preset" --platform "$platform" --schema >/dev/null
              if [ ! -f "$workdir/$name/values-$platform.yaml" ]; then
                echo "FAIL: $preset produced no overlay for $platform"
                exit 1
              fi
              hck check --chart "$workdir/$name" --platform "$platform" --strict >/dev/null
            done
            echo "  $preset: 4 platforms ok"
          done

          # Adding to an existing chart, and the guard when the overlay is absent.
          hck new later --dir "$workdir" >/dev/null
          hck platform add aws --chart "$workdir/later"
          hck check --chart "$workdir/later" --platform aws --strict >/dev/null
          if hck check --chart "$workdir/later" --platform gcp >/dev/null 2>&1; then
            echo "FAIL: --platform gcp passed without values-gcp.yaml"
            exit 1
          fi

          # An overlay that is merely accepted proves nothing: a check that
          # renders the base chart renders it fine. Assert the render changed.
          chart="$workdir/later"
          if hck check --chart "$chart" --print | grep -q 'eks.amazonaws.com/role-arn'; then
            echo "FAIL: the base already carries the IRSA annotation"
            exit 1
          fi
          # Captured rather than piped into grep -q, which closes the pipe on
          # its first match and under pipefail turns a matching assertion into
          # a failed step. The one above may pipe: it asserts no match, so
          # grep reads to the end and hck never loses the write.
          rendered=$(hck check --chart "$chart" --platform aws --print)
          [[ "$rendered" == *'eks.amazonaws.com/role-arn'* ]] || {
            echo "FAIL: --platform aws did not reach the render"
            exit 1
          }
          echo "PASS: platform overlays"

      # Environment overlays stack on top of a platform, and go last so their
      # size wins over whatever the platform set.
      - name: Render every preset at every environment
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          for preset in $(hck list presets --format json | jq -r '.presets[].name'); do
            for env in dev staging prod; do
              name="$preset-$env"
              hck new "$name" --dir "$workdir" --preset "$preset" --env "$env" --schema >/dev/null
              hck check --chart "$workdir/$name" --env "$env" --strict >/dev/null
            done
            echo "  $preset: 3 environments ok"
          done

          # Both axes at once, and the environment has to win.
          hck new both --dir "$workdir" --preset web --platform aws --env prod --schema >/dev/null
          chart="$workdir/both"
          hck check --chart "$chart" --platform aws --env prod --strict >/dev/null
          rendered=$(hck check --chart "$chart" --platform aws --env prod --print)
          [[ "$rendered" == *'eks.amazonaws.com/role-arn'* ]] || {
            echo "FAIL: the platform overlay was lost when an environment was added"
            exit 1
          }
          [[ "$rendered" == *'kind: PodDisruptionBudget'* ]] || {
            echo "FAIL: the prod overlay did not reach the render"
            exit 1
          }
          echo "PASS: environment overlays"

      # A chart hck just generated is by definition what hck generates, so
      # "hck sync" over one has to be clean. And the guards on remove are the
      # kind that only matter when they fire.
      - name: Remove and sync
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir" --preset web >/dev/null
          chart="$workdir/demo"

          hck sync --chart "$chart" --check >/dev/null

          # An edit is drift, and the report alone never touches the file.
          printf '\n# a local edit\n' >> "$chart/templates/hpa.yaml"
          if hck sync --chart "$chart" --check >/dev/null 2>&1; then
            echo "FAIL: --check passed a chart that differs"
            exit 1
          fi
          grep -q 'a local edit' "$chart/templates/hpa.yaml" || {
            echo "FAIL: the report overwrote the file"
            exit 1
          }

          # An edited template is somebody's work; remove refuses it.
          if hck remove hpa --chart "$chart" >/dev/null 2>&1; then
            echo "FAIL: remove deleted an edited template"
            exit 1
          fi
          hck sync --chart "$chart" --write hpa >/dev/null
          hck sync --chart "$chart" --check >/dev/null

          # A resource another one still requires is refused too.
          if hck remove service --chart "$chart" >/dev/null 2>&1; then
            echo "FAIL: remove deleted a Service the Ingress still points at"
            exit 1
          fi

          # The skeleton is compared too — the gap that mattered, since
          # _helpers.tpl is what every resource template calls into and
          # nothing else in the chart would ever notice it moving on.
          printf '\n{{/* an older helper set */}}\n' >> "$chart/templates/_helpers.tpl"
          rm "$chart/ci/install-values.yaml"
          # Read as JSON: the question here is which files were compared and
          # how each came out, and the text report answers it with a "=", "~"
          # or "!" in a column — an assertion coupled to the layout rather
          # than to the behaviour.
          report=$(hck sync --chart "$chart" --format json)
          jq -e 'any(.files[]; .path == "templates/_helpers.tpl")' >/dev/null <<<"$report" || {
            echo "FAIL: sync does not compare _helpers.tpl"
            exit 1
          }
          jq -e 'any(.files[]; .path == "ci/install-values.yaml" and .state == "missing")' >/dev/null <<<"$report" || {
            echo "FAIL: a deleted skeleton file was not reported as missing"
            exit 1
          }
          # ...but not the two files the author owns. Exact paths, so
          # ci/install-values.yaml no longer has to be told apart by column.
          if jq -e 'any(.files[]; .path == "Chart.yaml" or .path == "values.yaml")' >/dev/null <<<"$report"; then
            echo "FAIL: sync compares a file the chart author maintains"
            exit 1
          fi
          hck sync --chart "$chart" --write --all >/dev/null
          hck sync --chart "$chart" --check >/dev/null
          [ -f "$chart/ci/install-values.yaml" ] || { echo "FAIL: the missing skeleton file was not put back"; exit 1; }

          # And what it does remove is the template, not the values.
          before=$(wc -c < "$chart/values.yaml")
          hck remove hpa --chart "$chart" >/dev/null
          after=$(wc -c < "$chart/values.yaml")
          [ -e "$chart/templates/hpa.yaml" ] && { echo "FAIL: the template is still there"; exit 1; }
          [ "$before" = "$after" ] || { echo "FAIL: values.yaml was rewritten by a removal"; exit 1; }
          grep -q '^autoscaling:' "$chart/values.yaml" || {
            echo "FAIL: values.yaml lost a key to a removal"
            exit 1
          }
          hck check --chart "$chart" --strict >/dev/null
          echo "PASS: remove and sync"

      # A rule a chart turned off has to actually stop reporting, and the
      # JSON verdict has to agree with the exit status. Both are the kind of
      # thing that looks wired up while doing nothing at all.
      #
      # Every assertion here reads --format json. The text report is written
      # for people and its wording is not a contract: renaming one label
      # ("off in .hck.yaml:" to "not checked:") turned this step red while
      # nothing about the behaviour had changed.
      - name: Configure the house rules
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new ruled --dir "$workdir" >/dev/null
          chart="$workdir/ruled"

          # Runs hck check and reports its output and status without tripping
          # set -e, since half these assertions are about a non-zero exit.
          # stderr is dropped so that a failing run still leaves stdout as
          # nothing but the JSON document.
          check() {
            set +e
            out=$(hck check --chart "$chart" --no-render --format json "$@" 2>/dev/null)
            status=$?
            set -e
          }

          # The report carries a finding for that rule, at that severity when
          # one is named.
          reported() {
            jq -e --arg id "$1" --arg sev "${2:-}" \
              'any(.findings[]; .rule == $id and ($sev == "" or .severity == $sev))' \
              >/dev/null <<<"$out"
          }

          # The report says that rule was not checked at all, which is a
          # different thing from it having nothing to report.
          skipped() {
            jq -e --arg id "$1" '(.disabled // []) | index($id) != null' >/dev/null <<<"$out"
          }

          # Every rule the checker runs has to be listed, or a chart cannot
          # name it in its .hck.yaml.
          listing=$(hck list rules)
          for id in HCK013 HCK025 HCK030; do
            [[ "$listing" == *"$id"* ]] || { echo "FAIL: $id is not listed"; exit 1; }
          done

          # Strip the description, which trips HCK013 without needing helm.
          printf 'apiVersion: v2\nname: ruled\n' > "$chart/Chart.yaml"
          check
          reported HCK013 || { echo "FAIL: HCK013 did not fire"; exit 1; }
          [ "$status" -eq 0 ] || { echo "FAIL: a warning failed the check without --strict"; exit 1; }

          printf 'rules:\n  HCK013: off\n' > "$chart/.hck.yaml"
          check
          ! reported HCK013 || { echo "FAIL: HCK013 is off and still reported"; exit 1; }
          skipped HCK013 || { echo "FAIL: the report did not say what it skipped"; exit 1; }

          # The wildcard reaches every rule that can be configured, a named ID
          # beats it, and neither touches the one rule that is locked.
          printf 'rules:\n  "*": off\n  HCK013: warn\n' > "$chart/.hck.yaml"
          check
          reported HCK013 warn || { echo "FAIL: a named ID did not beat the wildcard"; exit 1; }
          if reported HCK001 || skipped HCK001; then
            echo "FAIL: the wildcard reached the locked rule"
            exit 1
          fi
          skipped HCK002 || { echo "FAIL: the wildcard did not turn the rest off"; exit 1; }

          # --off says the same thing for one run, layered over that file
          # rather than replacing it, and refuses what the file refuses.
          rm "$chart/.hck.yaml"
          check --off HCK013
          ! reported HCK013 || { echo "FAIL: --off did not turn the rule off"; exit 1; }
          skipped HCK013 || { echo "FAIL: --off did not say what it skipped"; exit 1; }
          check --off HCK001
          [ "$status" -ne 0 ] || { echo "FAIL: --off HCK001 was accepted"; exit 1; }
          check --off HCK999
          [ "$status" -ne 0 ] || { echo "FAIL: --off with an unknown rule ID was accepted"; exit 1; }

          # Raised to an error, the same finding fails the check.
          printf 'rules:\n  HCK013: error\n' > "$chart/.hck.yaml"
          check
          [ "$status" -ne 0 ] || { echo "FAIL: a rule raised to error did not fail the check"; exit 1; }

          # A rule ID nobody has is an error, not a silent no-op.
          printf 'rules:\n  HCK999: off\n' > "$chart/.hck.yaml"
          check
          [ "$status" -ne 0 ] || { echo "FAIL: an unknown rule ID was accepted"; exit 1; }

          # And the JSON verdict matches the exit status, --strict included.
          rm "$chart/.hck.yaml"
          check
          [ "$status" -eq 0 ] || { echo "FAIL: a passing run reported a failure"; exit 1; }
          jq -e '.ok' >/dev/null <<<"$out" || { echo "FAIL: a passing run did not report ok"; exit 1; }

          check --strict
          [ "$status" -ne 0 ] || { echo "FAIL: --strict passed a chart with warnings"; exit 1; }
          jq -e '.ok == false' >/dev/null <<<"$out" || { echo "FAIL: the JSON verdict disagrees with the exit status"; exit 1; }
          echo "PASS: rule configuration"

      # A scaler added beside a StatefulSet has to name the StatefulSet. It did
      # not, and nothing said so: the HPA rendered, installed, and never scaled.
      - name: References by name that nothing validates
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          printf 'image:\n  tag: "1.0.0"\nautoscaling:\n  enabled: true\n' > "$workdir/on.yaml"

          # Findings are read as JSON. A rule ID is permanent and the JSON
          # field names are part of the interface; the text layout is neither.
          report() {
            set +e
            out=$(hck check --format json "$@" 2>/dev/null)
            set -e
          }
          reported() {
            jq -e --arg id "$1" 'any(.findings[]; .rule == $id)' >/dev/null <<<"$out"
          }

          hck new sf --dir "$workdir" --preset stateful --schema >/dev/null
          hck add hpa --chart "$workdir/sf" >/dev/null
          grep -q 'targetKind: StatefulSet' "$workdir/sf/values.yaml" || {
            echo "FAIL: the HPA beside a StatefulSet still defaults to Deployment"
            exit 1
          }
          hck check --chart "$workdir/sf" -f "$workdir/on.yaml" --strict >/dev/null

          # And the check catches it whatever the cause: point the same HPA at
          # a kind the chart does not render.
          # Rewritten through a temporary file rather than sed -i, which
          # takes an argument on BSD and none on GNU — so this step can be run
          # by hand on the machine it was written on.
          edited=$(mktemp)
          sed 's/targetKind: StatefulSet/targetKind: Deployment/' "$workdir/sf/values.yaml" > "$edited"
          mv "$edited" "$workdir/sf/values.yaml"
          report --chart "$workdir/sf" -f "$workdir/on.yaml"
          reported HCK033 || { echo "FAIL: a dangling scale target was not reported"; exit 1; }
          # The kind the chart renders, not a label: HCK033 has to name it, or
          # the reader has to go and look it up themselves.
          jq -e 'any(.findings[]; .rule == "HCK033" and (.message | contains("StatefulSet/sf")))' \
            >/dev/null <<<"$out" || {
            echo "FAIL: the finding does not say what the chart renders"
            exit 1
          }
          if hck check --chart "$workdir/sf" -f "$workdir/on.yaml" --strict >/dev/null 2>&1; then
            echo "FAIL: --strict passed a scaler aimed at nothing"
            exit 1
          fi

          # Removing a workload out from under a scaler reaches the same place.
          hck new demo --dir "$workdir" --preset web >/dev/null
          hck remove deployment --chart "$workdir/demo" >/dev/null
          report --chart "$workdir/demo" -f "$workdir/on.yaml"
          reported HCK033 || { echo "FAIL: a scaler left behind by remove was not reported"; exit 1; }
          echo "PASS: scale targets"

          # Two more references by name that nothing validates: the issuer a
          # Certificate points at, and the container port a Service forwards
          # to. Both are produced by ordinary "hck add" combinations.
          hck new certs --dir "$workdir" --preset web >/dev/null
          hck add certificate issuer --chart "$workdir/certs" >/dev/null
          printf 'image:\n  tag: "1.0.0"\ncertificate: {enabled: true}\nissuer: {enabled: true, kind: selfSigned}\n' > "$workdir/certs-on.yaml"
          report --chart "$workdir/certs" -f "$workdir/certs-on.yaml"
          reported HCK034 || { echo "FAIL: an Issuer nothing uses was not reported"; exit 1; }

          hck new agent --dir "$workdir" --preset daemon >/dev/null
          hck add service --chart "$workdir/agent" >/dev/null
          report --chart "$workdir/agent"
          reported HCK035 || { echo "FAIL: a Service forwarding to nothing was not reported"; exit 1; }
          echo "PASS: dangling references"

          # A budget that allows nothing applies cleanly and wedges the next
          # node drain. hck's own defaults must stay out of it.
          hck new budget --dir "$workdir" --preset web >/dev/null
          printf 'image:\n  tag: "1.0.0"\nreplicaCount: 3\npodDisruptionBudget: {enabled: true}\n' > "$workdir/pdb-ok.yaml"
          hck check --chart "$workdir/budget" -f "$workdir/pdb-ok.yaml" --strict >/dev/null

          printf 'image:\n  tag: "1.0.0"\nreplicaCount: 1\npodDisruptionBudget: {enabled: true, minAvailable: 1}\n' > "$workdir/pdb-wedge.yaml"
          report --chart "$workdir/budget" -f "$workdir/pdb-wedge.yaml"
          reported HCK036 || { echo "FAIL: a budget that blocks every drain was not reported"; exit 1; }
          echo "PASS: disruption budgets"

      # init has to produce exactly what the command it prints would produce.
      - name: Scaffold interactively
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          viainit=$(mktemp -d)
          # The long path: "n" to "Keep those?" opens the four the preset had
          # answered, so this still exercises every question init can put.
          printf 'app\nstateful\npvc\nn\ngcp\nprod\ny\nn\n' | hck init -d "$viainit" > /tmp/init.log
          hck check --chart "$viainit/app" --platform gcp --env prod --strict >/dev/null

          # The short path: a preset that carries a platform and asks for a
          # schema produces both without either being asked about.
          short=$(mktemp -d)
          printf 'house\nbase\n\n\n' | hck init -d "$short" > /tmp/short.log
          for f in values-onprem.yaml values.schema.json README.md; do
            test -f "$short/house/$f" || {
              echo "FAIL: the preset decided $f and init did not write it"
              exit 1
            }
          done
          if grep -q 'Platform overlays?' /tmp/short.log; then
            echo "FAIL: init asked a question the preset had answered"
            exit 1
          fi
          hck check --chart "$short/house" --platform onprem --strict >/dev/null

          # Run the equivalent it printed, into a second directory.
          vianew=$(mktemp -d)
          cmd=$(grep -A1 'without the questions' /tmp/init.log | tail -1 | sed 's/^ *//')
          echo "printed: $cmd"
          ${cmd/$viainit/$vianew}
          diff -r "$viainit/app" "$vianew/app"
          echo "PASS: init"

      # Every optional resource defaults to off, so a chart carrying all of
      # them renders none of them and a check over it proves nothing.
      - name: Render every resource with everything enabled
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new all --dir "$workdir" --preset web --schema >/dev/null
          chart="$workdir/all"
          extra=$(hck list resources --format json | jq -r '.resources[].name' \
            | grep -vE '^(deployment|statefulset|daemonset|cronjob)$' | tr '\n' ' ')
          hck add $extra --chart "$chart" >/dev/null

          # Three findings are expected here, and each is the rule working
          # rather than a template misbehaving: HCK031 because HPA and KEDA
          # both scale this workload, HCK037 because turning everything on
          # necessarily turns on both halves of a competing pair — the
          # cert-manager Certificate beside the GKE ManagedCertificate, and
          # the ServiceMonitor beside the PodMonitoring — and HCK039 because
          # the SecretStore is on while the ExternalSecret still reads the
          # default ClusterSecretStore.
          #
          # Read as JSON so that the set of rules that fired is the assertion,
          # rather than whatever the text report happens to word them as.
          hck check --chart "$chart" -f cmd/cli/testdata/enable-all.yaml \
            --format json > /tmp/all.json 2>/dev/null || true
          fired=$(jq -r '[.findings[].rule] | unique | sort | join(",")' /tmp/all.json)
          if [ "$fired" != "HCK031,HCK037,HCK039" ]; then
            echo "FAIL: expected HCK031,HCK037,HCK039 and nothing else, got: ${fired:-none}"
            jq '.findings' /tmp/all.json
            exit 1
          fi
          # Assert each resource actually appears. The point of the step is
          # that "no findings" over a chart rendering nothing proves nothing,
          # so this has to check the render, not just iterate over names.
          #
          # Unique source files, not documents: rbac.yaml alone emits a Role
          # and a RoleBinding, so counting "# Source:" lines overcounts.
          hck check --chart "$chart" -f cmd/cli/testdata/enable-all.yaml --print > /tmp/all.yaml
          want=$(hck list resources --format json | jq -r '.resources[].name' \
            | grep -vcE '^(statefulset|daemonset|cronjob)$')
          got=$(grep '^# Source: all/templates/' /tmp/all.yaml | sort -u | wc -l | tr -d ' ')
          echo "  catalog expects $want resources, render carries $got"
          if [ "$got" -ne "$want" ]; then
            echo "FAIL: the render does not cover the catalog"
            grep '^# Source:' /tmp/all.yaml | sort -u
            exit 1
          fi
          echo "PASS: every resource renders"

      # The two overlay axes must not both claim a key: they are both -f
      # arguments, so an overlap makes the render depend on argument order.
      - name: Overlays are order-independent
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new ov --dir "$workdir" --preset web >/dev/null
          chart="$workdir/ov"
          for p in aws gcp azure onprem; do hck platform add "$p" --chart "$chart" --force >/dev/null; done
          for e in dev staging prod; do hck env add "$e" --chart "$chart" --force >/dev/null; done
          for p in aws gcp azure onprem; do
            for e in dev staging prod; do
              a=$(helm template t "$chart" -f "$chart/ci/install-values.yaml" -f "$chart/values-$p.yaml" -f "$chart/values-$e.yaml" | sha256sum)
              b=$(helm template t "$chart" -f "$chart/ci/install-values.yaml" -f "$chart/values-$e.yaml" -f "$chart/values-$p.yaml" | sha256sum)
              if [ "$a" != "$b" ]; then
                echo "FAIL: $p and $e disagree about a key; the render depends on -f order"
                exit 1
              fi
            done
          done
          echo "PASS: order-independent"

      # A chart that never asked for a schema must not acquire one.
      - name: Keep the schema opt-in
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new noschema --dir "$workdir"
          hck add pdb servicemonitor --chart "$workdir/noschema"
          if [ -e "$workdir/noschema/values.schema.json" ]; then
            echo "FAIL: hck add introduced a schema the chart never asked for"
            exit 1
          fi
          echo "PASS: opt-in"

      - name: Two workloads are a shape, not a refusal
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          workdir=$(mktemp -d)
          hck new demo --dir "$workdir"

          renders() {
            hck check --chart "$1" --format json 2>/dev/null \
              | jq -e 'any(.findings[]; .rule == "HCK030")' >/dev/null
          }

          # A second workload beside the one already there is built and noted.
          # This is the Deployment-to-Rollout swap, and refusing it here
          # answered from the resource names a question only the render can
          # answer.
          note=$(hck add statefulset --chart "$workdir/demo")
          [[ "$note" == *"HCK030"* ]] || {
            echo "FAIL: a second workload was added without a word about it"
            exit 1
          }
          test -f "$workdir/demo/templates/statefulset.yaml" || {
            echo "FAIL: the second workload was not written"
            exit 1
          }

          # Unguarded, both render, and that is what HCK030 is for.
          renders "$workdir/demo" || {
            echo "FAIL: two workloads rendering was not reported"
            exit 1
          }
          if hck check --chart "$workdir/demo" --strict; then
            echo "FAIL: --strict passed a chart rendering two workloads"
            exit 1
          fi

          # Guard one of them and the finding goes away, because the chart now
          # renders one. This is the whole reason the refusal became a note: a
          # template in the chart is not a workload in the render.
          guarded="$workdir/demo/templates/statefulset.yaml"
          { echo '{{- if .Values.useStatefulSet }}'; cat "$guarded"; echo '{{- end }}'; } > /tmp/g
          mv /tmp/g "$guarded"
          if renders "$workdir/demo"; then
            echo "FAIL: HCK030 fires over a workload that no longer renders"
            exit 1
          fi

          # --with on top of the preset's own workload reaches the same place,
          # and no longer needs --force.
          note=$(hck new two --dir "$workdir" --preset web --with daemonset)
          [[ "$note" == *"HCK030"* ]] || {
            echo "FAIL: hck new --with said nothing about the second workload"
            exit 1
          }
          renders "$workdir/two" || {
            echo "FAIL: two workloads from hck new were not reported"
            exit 1
          }

          # Two arriving in the same command, into a chart that has none.
          hck new bare --dir "$workdir" --preset cronjob
          rm "$workdir/bare/templates/cronjob.yaml"
          note=$(hck add deployment daemonset --chart "$workdir/bare")
          [[ "$note" == *"HCK030"* ]] || {
            echo "FAIL: two workloads at once said nothing"
            exit 1
          }

          # One workload says nothing at all — a note on every chart is a note
          # nobody reads.
          note=$(hck new solo --dir "$workdir" --preset minimal)
          [[ "$note" != *"HCK030"* ]] || {
            echo "FAIL: a chart with one workload was told about workloads"
            exit 1
          }

          hck new twoforced --dir "$workdir" --preset web --with daemonset

          # A directory that is not empty is refused, and --force fills it in
          # rather than writing over it. Overwriting would take values.yaml
          # with it, and values.yaml is never rewritten.
          if hck new twoforced --dir "$workdir" --preset web; then
            echo "FAIL: a directory that is not empty was accepted"
            exit 1
          fi
          printf '\n# a line only this chart has\n' >> "$workdir/twoforced/values.yaml"
          before=$(sha256sum < "$workdir/twoforced/values.yaml")
          rm "$workdir/twoforced/templates/service.yaml"
          # Captured rather than piped into grep: grep -q closes the pipe on
          # its first match, and under pipefail that makes hck losing the
          # write a failed step — which it did, intermittently. hck new has no
          # --format json either, so this is the same text exception as sync.
          filled=$(hck new twoforced --dir "$workdir" --preset web --with daemonset --force)
          [[ "$filled" == *"already there"* ]] || {
            echo "FAIL: --force did not report what it kept in place"
            exit 1
          }
          test -f "$workdir/twoforced/templates/service.yaml" || {
            echo "FAIL: --force did not put the missing template back"
            exit 1
          }
          [ "$before" = "$(sha256sum < "$workdir/twoforced/values.yaml")" ] || {
            echo "FAIL: hck new --force rewrote values.yaml"
            exit 1
          }
          echo "PASS: two workloads, and a directory that is not empty"

  ci-result:
    name: CI Result
    if: always()
    needs:
      - unit-tests
      - build
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "[FAIL] Some jobs failed or were cancelled"
            exit 1
          fi
          echo "[PASS] All CI jobs passed"
